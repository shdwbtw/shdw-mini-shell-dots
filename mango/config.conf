# More option see https://github.com/DreamMaoMao/mango/wiki/

source=~/.config/mango/windowEffects.conf
source=~/.config/mango/animations.conf
source=~/.config/mango/layouts.conf
source=~/.config/mango/inputs.conf
source=~/.config/mango/bindings.conf
source=~/.config/mango/theme.conf

# Startup commands
# exec_once=swaybg -i ~/Pictures/Wallpaper/canyon.jpg -m fill
# awww restores the last wallpaper picked in the quickshell switcher
exec_once=awww-daemon
# exec_once=mpvpaper -o "--loop" ALL ~/Videos/Wallpapers/blue-archive-izuna-swimsuit-1080p-60fps.mp4
# exec_once=waybar
exec_once=qs
# exec_once=nm-applet
# exec_once=swaync
# exec_once=blueman-adapters

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# layer rule
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi

# monitor rule
monitor_rule=name:eDP-1,width:1920,height:1080,refresh:60,x:0,y:0
monitor_rule=name:HDMI-A-1,width:1920,height:1080,refresh:100,x:1920x,y:0