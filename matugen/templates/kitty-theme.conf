# Generated by matugen from ~/.config/matugen/templates/kitty-theme.conf;
# edit the template, this file is overwritten on every wallpaper change.
# ANSI colors are the gruvbox hues blended toward the wallpaper
# ([config.custom_colors] in ~/.config/matugen/config.toml).

